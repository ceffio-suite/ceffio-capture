name: image

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    # THE TESTS RUN BEFORE THE IMAGE, and they need NOTHING from it: the
    # notification logic and the endpoint are tested with the standard library
    # alone, with the Kubernetes client stubbed. A one-minute job is a cheap
    # guard for the code a forged notification would reach first.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: python3 -m unittest discover -s tests -v

  build:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (no push on a pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false

      - name: Compute the tags
        # A PRE-RELEASE IS NEVER `latest`. Publishing `:latest` on every `v*`
        # tag means an `-rc.1` becomes the version everyone pulls by default —
        # the release channel would offer a candidate as if it were the product.
        # Same rule as the main repository's release.yml.
        if: github.event_name != 'pull_request'
        id: tags
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAGS="ghcr.io/ceffio-suite/ceffio-capture:${TAG}"
          case "$TAG" in
            *-*) echo "prerelease tag: ':latest' is NOT updated" ;;
            *)   TAGS="${TAGS}"$'\n'"ghcr.io/ceffio-suite/ceffio-capture:latest" ;;
          esac
          {
            echo "liste<<FIN_TAGS"
            echo "$TAGS"
            echo "FIN_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (tagged release)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # THE IMAGE CARRIES ITS OWN BILL OF MATERIALS AND ITS PROVENANCE, so
          # an operator can ask the registry what is inside, and how it was
          # built, without trusting a release note.
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.liste }}

      - name: Prove the image carries its SBOM and its provenance
        # "The build said pushed" proves nothing about the attestation; this
        # reads it back from the registry, the way an operator would.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/ceffio-suite/ceffio-capture:${GITHUB_REF_NAME}"
          for ATTESTATION in SBOM Provenance; do
            VALEUR="$(docker buildx imagetools inspect "$IMAGE" --format "{{ json .${ATTESTATION} }}")"
            echo "${ATTESTATION} of ${IMAGE}: $(echo "$VALEUR" | head -c 300)"
            if [ -z "$VALEUR" ] || [ "$VALEUR" = "null" ]; then
              echo "::error::${IMAGE} carries no ${ATTESTATION} attestation"
              exit 1
            fi
          done
