name: image

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    # THE TESTS RUN BEFORE THE IMAGE, and they need NOTHING from it: the
    # notification logic and the endpoint are tested with the standard library
    # alone, with the Kubernetes client stubbed. A one-minute job is a cheap
    # guard for the code a forged notification would reach first.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: python3 -m unittest discover -s tests -v

  build:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (no push on a pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false

      - name: Build and push (tagged release)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ceffio-suite/ceffio-capture:${{ github.ref_name }}
            ghcr.io/ceffio-suite/ceffio-capture:latest
