name: image

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # A VULNERABILITY FOUND AFTER THE RELEASE MUST BE SEEN WITHOUT WAITING FOR THE
  # NEXT ONE. Weekly, on the published image.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  tests:
    # THE TESTS RUN BEFORE THE IMAGE, and they need NOTHING from it: the
    # notification logic and the endpoint are tested with the standard library
    # alone, with the Kubernetes client stubbed. A one-minute job is a cheap
    # guard for the code a forged notification would reach first.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: python3 -m unittest discover -s tests -v

  build:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (no push on a pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false

      - name: Compute the tags
        # A PRE-RELEASE IS NEVER `latest`. Publishing `:latest` on every `v*`
        # tag means an `-rc.1` becomes the version everyone pulls by default —
        # the release channel would offer a candidate as if it were the product.
        # Same rule as the main repository's release.yml.
        if: github.event_name != 'pull_request'
        id: tags
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAGS="ghcr.io/ceffio-suite/ceffio-capture:${TAG}"
          case "$TAG" in
            *-*) echo "prerelease tag: ':latest' is NOT updated" ;;
            *)   TAGS="${TAGS}"$'\n'"ghcr.io/ceffio-suite/ceffio-capture:latest" ;;
          esac
          {
            echo "liste<<FIN_TAGS"
            echo "$TAGS"
            echo "FIN_TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (tagged release)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # THE IMAGE CARRIES ITS OWN BILL OF MATERIALS AND ITS PROVENANCE, so
          # an operator can ask the registry what is inside, and how it was
          # built, without trusting a release note.
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.liste }}

      - name: Prove the image carries its SBOM and its provenance
        # "The build said pushed" proves nothing about the attestation; this
        # reads it back from the registry, the way an operator would.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/ceffio-suite/ceffio-capture:${GITHUB_REF_NAME}"
          for ATTESTATION in SBOM Provenance; do
            VALEUR="$(docker buildx imagetools inspect "$IMAGE" --format "{{ json .${ATTESTATION} }}")"
            echo "${ATTESTATION} of ${IMAGE}: $(echo "$VALEUR" | head -c 300)"
            if [ -z "$VALEUR" ] || [ "$VALEUR" = "null" ]; then
              echo "::error::${IMAGE} carries no ${ATTESTATION} attestation"
              exit 1
            fi
          done
  # THE IMAGE WE PUBLISH IS SCANNED, AND STAYS SCANNED: the tag does not change,
  # the vulnerability database does.
  scan:
    name: scan the published image
    needs: build
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Scan the image
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          # ON A TAG, THAT TAG; ON THE WEEKLY RUN, `latest` — the version an
          # installation pulls today.
          image: ghcr.io/ceffio-suite/ceffio-capture:${{ github.event_name == 'schedule' && 'latest' || github.ref_name }}
          # THE SAME RULE AS THE REST OF THE SUITE: only a CRITICAL finding WITH a
          # fix stops the build. Everything else is reported.
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: json
          output-file: grype-capture.json
          grype-version: v0.121.0
          cache-db: true

      - name: Summarise the scan
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s grype-capture.json ]; then
            echo "### Grype, image ceffio-capture — aucun rapport produit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - grype-capture.json >> "$GITHUB_STEP_SUMMARY" <<'FIN_PYTHON'
          import json, sys
          d = json.load(open(sys.argv[1]))
          matches = d.get("matches") or []
          ordre = ["Critical", "High", "Medium", "Low", "Negligible", "Unknown"]
          compte = {s: [0, 0] for s in ordre}
          for m in matches:
              sev = (m.get("vulnerability") or {}).get("severity") or "Unknown"
              fixe = ((m.get("vulnerability") or {}).get("fix") or {}).get("state") == "fixed"
              if sev not in compte:
                  sev = "Unknown"
              compte[sev][0] += 1
              if fixe:
                  compte[sev][1] += 1
          print("### Grype, image ceffio-capture")
          print()
          print("| Sévérité | Total | Avec correctif |")
          print("|---|---|---|")
          for s in ordre:
              total, fixe = compte[s]
              if total or s == "Critical":
                  print("| %s | %d | %d |" % (s, total, fixe))
          print()
          print("%d vulnérabilité(s) au total, %d avec un correctif."
                % (sum(c[0] for c in compte.values()), sum(c[1] for c in compte.values())))
          FIN_PYTHON
